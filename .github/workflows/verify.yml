name: Verify finance demonstration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test deterministic assessment calculations
        run: node --experimental-strip-types --test tests/assessment-engine.test.mjs
      - name: Test Wigwam finance controls and demonstration calculations
        run: node --experimental-strip-types --test tests/wigwam-finance.test.mjs
      - name: Check Wigwam demo claims against verified requirements
        run: node --test tests/wigwam-fidelity.test.mjs
      - name: Next.js static build
        run: npm run build
      - name: Check the CFO and advisory journeys in desktop and mobile Chrome
        run: |
          python -m venv "$RUNNER_TEMP/presentation-tests"
          source "$RUNNER_TEMP/presentation-tests/bin/activate"
          pip install playwright==1.56.0
          python -m http.server 8659 --directory out > "$RUNNER_TEMP/preview.log" 2>&1 &
          python tests/presentation_smoke.py http://localhost:8659/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presentation-previews
          path: qa-evidence/
          retention-days: 7
      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-intelligence-static-site
          path: out/
          retention-days: 7
