name: Verify finance demonstration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test deterministic assessment calculations
        run: node --experimental-strip-types --test tests/assessment-engine.test.mjs
      - name: Next.js static build
        run: npm run build
      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-intelligence-static-site
          path: out/
          retention-days: 7
